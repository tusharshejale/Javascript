<!DOCTYPE html>
<html lang="en">
<head>
    <title>Phone_Number_Validation</title>
</head>
<body style="display: flex; justify-content: center;">
    <div class="container">
        <h1>phone number validation</h1>
        <form>
            <label for="Phonenumber">Phone Number:</label><br>
            <select id="countryCode" name="countryCode" required>
                <option value="+1" selected>🇺🇸 +1 (US)</option>
                <option value="+91">🇮🇳 +91 (India)</option>
                <option value="+44">🇬🇧 +44 (UK)</option>
                <option value="+61">🇦🇺 +61 (Australia)</option>
                <option value="+81">🇯🇵 +81 (Japan)</option>
                <option value="+49">🇩🇪 +49 (Germany)</option>
                <option value="+33">🇫🇷 +33 (France)</option>
                <option value="+86">🇨🇳 +86 (China)</option>
                <option value="+971">🇦🇪 +971 (UAE)</option>
                <option value="+55">🇧🇷 +55 (Brazil)</option>
              </select>
            <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="Enter 10-digit number" pattern="\d{10}" required><br><br>

            <label for="name">Name</label><br><br>
            <input type="text" id="name" name="name"><br><br>
            <button type="submit">Submit</button>
        </form>
    </div>  
</body>
</html>
