<!DOCTYPE html>
<html lang="en">
<head>
    <title>Date</title>
</head>
<body>
    <script>
        const time = new Date();
        console.log(time);
        //this are the methods are used to determine the content from date methods
        console.log(`get time is : ${time.getTime()}`); //it gives milliseconds from 1 st january in that year 

        console.log(`get fullyear is : ${time.getFullYear()}`);
        //millisecons are when date is get as output 
        console.log(`getmilliseconds is : ${time.getMilliseconds()}`);//The getMilliseconds() method in JavaScript is used to retrieve the milliseconds portion of a Date object.

        console.log(`getday is : ${time.getDay()}`);//The getDay() method in JavaScript is used to retrieve the day of the week for a given Date object, according to local time.

        console.log(`gethours is : ${time.getHours()}`);

        console.log(`getmonth is : ${time.getMonth()}`);

        console.log(`getminute is : ${time.getMinutes()}`);
        // const time2 = getFullYear();
        // cnsole.log(time2);
    </script>
</html>
